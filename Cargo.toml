[package]
name = "fermah-small-blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.5.4"
rand = "0.8.5"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.40.0", features = ["full"] }

# Full debug info for every dependency is most of a dev build's size on disk.
# Dependencies keep none; workspace crates keep line tables, so a backtrace
# still names the file and line in our code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
